# Generated from server/config/setup.conf(.example) by client/render-client-configs.sh
# Personal domain rules are inserted by client/manage-user-rules.ps1.

mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: true
unified-delay: true
profile:
  store-selected: true

proxy-providers:
  vps:
    type: http
    url: '__VPS_PROVIDER_URL__'
    path: ./proxy_providers/vps.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

proxy-groups:
- name: Auto
  type: url-test
  use:
  - vps
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  lazy: true
- name: PROXY
  type: select
  proxies:
  - Auto
  use:
  - vps

rules:
# __USER_RULES__
- IP-CIDR,__VPS_PUBLIC_IP__/32,DIRECT,no-resolve
- DOMAIN-SUFFIX,github.com,PROXY
- DOMAIN-SUFFIX,githubusercontent.com,PROXY
